spring:
  application:
    name: b2b-marketplace
  threads:
    virtual:
      enabled: true
  datasource:
    # No defaults for credentials: they come from the environment
    # (AWS Secrets Manager in deployed environments, application-local.yml locally).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Photos: 5 MB each (checked again in the service), one per request.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  shutdown: graceful
  forward-headers-strategy: framework # Behind the AWS load balancer.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

app:
  version: "@project.version@"
  auth:
    # Which tokens are accepted. No defaults: they come from the environment
    # (Google in deployed environments: issuer https://accounts.google.com, alias
    # accounts.google.com, audience = the Google OAuth client id; application-local.yml locally).
    issuer-uri: ${AUTH_ISSUER_URI}
    issuer-aliases: ${AUTH_ISSUER_ALIASES:}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
    audience: ${AUTH_AUDIENCE}
  # Private photo storage. On AWS: STORAGE_BUCKET only (credentials come from the IAM role).
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:ap-south-1}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:false}
    create-bucket: ${STORAGE_CREATE_BUCKET:false}
  # The search assistant (Phase 7): any OpenAI-compatible chat API. Default: Google Gemini.
  # No key means no assistant: questions simply go to normal search.
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.1-flash-lite}
    # "none" turns thinking off: faster, and enough for turning a question
    # into filters. Blank leaves the provider's default.
    reasoning-effort: ${AI_REASONING_EFFORT:none}
    timeout: ${AI_TIMEOUT:5s}
    # Reading label photos (Phase 8) runs in the background after upload.
    vision-timeout: ${AI_VISION_TIMEOUT:15s}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:200}
    vision-daily-limit: ${AI_VISION_DAILY_LIMIT:100}
    visitor-per-minute: ${AI_VISITOR_PER_MINUTE:10}
    visitor-per-day: ${AI_VISITOR_PER_DAY:100}
    log-retention-days: ${AI_LOG_RETENTION_DAYS:90}
  admin:
    # Local development only: these emails (comma-separated) become platform admins on sign-in. Never set
    # this in a deployed environment; grant admins there as described in docs/admin-setup.md.
    bootstrap-email: ${BOOTSTRAP_ADMIN_EMAIL:}
