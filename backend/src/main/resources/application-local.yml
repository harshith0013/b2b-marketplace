# Local development only. Matches docker-compose.yml. Never use these values elsewhere.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/b2b_marketplace}
    username: ${DB_USERNAME:b2b_app}
    password: ${DB_PASSWORD:local_dev_only}

management:
  endpoint:
    health:
      show-details: always

# Local mock OAuth2 server from docker-compose.yml (sign-in with a fixed dev code, no AWS).
app:
  auth:
    issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8090/default}
    audience: ${AUTH_AUDIENCE:b2b-marketplace-api}
