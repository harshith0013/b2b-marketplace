# Local development only. Credentials here are throwaway defaults; override in .env.
name: b2b-marketplace

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: b2b_marketplace
      POSTGRES_USER: ${POSTGRES_USER:-b2b_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432" # Bound to localhost only.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for Google sign-in: a login page where any email can be typed. Never deployed.
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./backend/src/test/resources/mock-oauth2/config.json:/config/config.json:ro
    ports:
      - "127.0.0.1:8090:8080" # Bound to localhost only.

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/b2b_marketplace
      DB_USERNAME: ${POSTGRES_USER:-b2b_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      # Tokens name the issuer as seen from the host; keys are fetched over the Compose network.
      AUTH_ISSUER_URI: http://localhost:8090/default
      AUTH_JWK_SET_URI: http://mock-oauth2:8080/default/jwks
      AUTH_AUDIENCE: b2b-marketplace-web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-oauth2:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      APP_BASE_URL: http://localhost:3000
      # Sign-in: the browser uses localhost:8090; this server reaches the same mock internally.
      AUTH_ISSUER: http://localhost:8090/default
      AUTH_ISSUER_INTERNAL_URL: http://mock-oauth2:8080
      AUTH_ALLOW_HTTP_ISSUER: "true"
      AUTH_CLIENT_ID: b2b-marketplace-web
      AUTH_CLIENT_SECRET: local-dev-only
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-session-secret-0123456789}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
