name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting
        run: mvn -B -ntp spotless:check
      - name: Unit and integration tests (Testcontainers uses the runner's Docker)
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  # Builds the real images and runs them together (website, backend, PostgreSQL, mock sign-in,
  # SeaweedFS photo storage),
  # then signs in through the browser. Replaces a build-only check of the images.
  e2e-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Full-stack end-to-end tests
        working-directory: frontend
        run: npm run test:e2e:stack
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
